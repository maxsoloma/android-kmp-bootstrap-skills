tasks:
  resources:
    action: !bootstrap.build.prepareResources
      assets: ${project.rootDir}/skills/bootstrap-project/assets
      toolchain: ${project.rootDir}/skills/bootstrap-project/supporting/toolchain.json
      sourceResources: ${project.rootDir}/src/main/resources
      output: ${taskOutputDir}
  bundle:
    action: !bootstrap.build.bundle
      app: ${module.jar}
      dependencies: ${module.runtimeClasspath}
      output: ${project.rootDir}/build/bootstrap.jar
      skill: ${project.rootDir}/skills/bootstrap-project/bin/bootstrap.jar

generated:
  resources:
    - directory: ${tasks.resources.action.output}

commands:
  - bundle
